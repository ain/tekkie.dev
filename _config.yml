# Site settings
title: tekkie
#email: ain@flashbit.net
description: Technology blog by Ain Tohvri. Contributor & maintainer of various Free and Open Source Software projects.
baseurl: ""
url: "https://tekkie.dev"
locale: en_GB
twitter_username: tekkie
github_username: ain
linkedin_username: aintohvri
mastodon_username: tekkie
user_image: /assets/ain.jpg
logo: /assets/ain.jpg
job_title: CTO
employer:
  name: Samwise
  url: https://samwise-media.com

# Build settings
markdown: kramdown
permalink: /:categories/:title
# The github-pages gem used to force this; without it Sass output is expanded.
sass:
  style: compressed
  sourcemap: never
# The remaining settings in this block were also supplied by the github-pages
# gem and are kept to preserve its behaviour. Jekyll's own default for `future`
# is false, which would silently drop a post dated ahead of the build; gist
# noscript fallbacks are off because generating them fetches each gist from
# github.com at build time.
future: true
gist:
  noscript: false
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-mentions
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-last-modified-at
# TODO: remove last_modified_at in YFM on each individual update
last-modified-at:
  date-format: '%b %-d, %Y'
paginate: 5
include:
  - _pages
# NB: this replaces Jekyll's default exclude list rather than adding to it, so
# the defaults have to be repeated here. Without vendor/, CI builds scan the
# gems installed into ./vendor/bundle and fail on Jekyll's own site template.
exclude:
  - CNAME
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
jekyll-mentions:
  base_url: https://twitter.com
twitter:
  username: tekkie
  card: summary
social:
  name: Ain Tohvri
  links:
    - https://twitter.com/tekkie
    - https://www.linkedin.com/in/aintohvri
    - https://github.com/ain
    - https://msdtn.social/@tekkie
